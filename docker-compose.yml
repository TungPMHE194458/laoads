# LaoAds — compose cho môi trường triển khai (không dùng cho dev local).
# Dev: `./mvnw -pl laoads-web -am spring-boot:run` (BE :8095) + `npm run dev` (FE :5173).
#
# Server Unitel thường không có internet → build ở máy dev rồi đẩy image (giống BOC):
#   docker compose build
#   docker save laoads-be:latest laoads-fe:latest | gzip > laoads-images.tar.gz
#   (scp lên server) → docker load → docker compose up -d
# Biến môi trường BE đặt trong .env.prod (KHÔNG commit), xem laoads-backend/README hoặc CLAUDE.md.

services:
  laoads-be:
    build:
      context: ./laoads-backend
      dockerfile: Dockerfile
    image: laoads-be:latest
    container_name: laoads-be
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      TZ: Asia/Vientiane
    ports:
      - "${LAOADS_BE_PORT:-8391}:8080"
    volumes:
      - ./logs/be:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/actuator/health/liveness"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 90s

  laoads-fe:
    build:
      context: ./laoads-web
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: ${LAOADS_FE_API_MODE:-real}
    image: laoads-fe:latest
    container_name: laoads-fe
    restart: unless-stopped
    ports:
      - "${LAOADS_FE_PORT:-8392}:80"
    depends_on:
      laoads-be:
        condition: service_started
