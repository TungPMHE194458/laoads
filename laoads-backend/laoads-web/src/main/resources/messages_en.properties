# ===== Customer list template (instructions sheet) =====
segment.template.sheet=Instructions
segment.template.title=How to fill in the customer list file
segment.template.line1=Enter one subscriber number per row in the isdn column of the ISDN sheet, starting right below the header row.
segment.template.line2=Accepted formats: 856 20 XXXXXXXX, 020 XXXXXXXX or 20 XXXXXXXX (spaces, dashes or + are allowed).
segment.template.line3=Duplicate numbers and invalid rows are skipped; the number of skipped rows is shown after the list is created.
segment.template.line4=Only the isdn column of the first sheet is read; other columns and sheets are ignored.
segment.template.line5=Save the file as .xlsx, .xls or .csv, up to 20MB.
conversion.template.sheet=Instructions
conversion.template.title=How to fill in the list of customers who reached the goal
conversion.template.line1=Enter one subscriber number that reached the campaign goal per row in the isdn column of the ISDN sheet, starting right below the header.
conversion.template.line2=Accepted formats: 856 20 XXXXXXXX, 020 XXXXXXXX or 20 XXXXXXXX (spaces, dashes or + are allowed).
conversion.template.line3=Only numbers that are part of the campaign (messaged or in the control group) are counted; duplicates and invalid numbers are skipped.
conversion.template.line4=Save the file as .xlsx, .xls or .csv and upload it on the campaign detail page, Settings tab, Upload conversion list.
