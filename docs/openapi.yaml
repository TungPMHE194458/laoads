openapi: 3.1.0
info:
  title: Unitel LaoAds Backend API
  description: "LaoAds — nền tảng chiến dịch/quảng cáo Unitel Lào. Envelope ApiResponse\
    \ (docs/API_CONTRACT_V1.md). Header Accept-Language: vi | en | lo."
  license:
    name: Proprietary
  version: v1
servers:
- url: http://localhost:8095/api
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: admin-permission
  description: Ma trận quyền (SUPER_ADMIN)
- name: admin-user
  description: Quản trị tài khoản (SUPER_ADMIN)
- name: workspace
  description: Workspace của tôi
- name: member
  description: Thành viên workspace
- name: price-quote
  description: Bảng giá (Quản lý chi phí)
- name: audit-log
  description: Nhật ký hệ thống
- name: auth
  description: Đăng nhập / refresh / VSA / đổi mật khẩu
- name: admin-workspace
  description: Quản trị workspace (SUPER_ADMIN)
paths:
  /v1/workspaces/{id}:
    get:
      tags:
      - workspace
      summary: Chi tiết workspace — thành viên ACTIVE hoặc SUPER_ADMIN
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseWorkspaceDto"
    put:
      tags:
      - workspace
      summary: Cập nhật thông tin workspace — cần WORKSPACE_UPDATE
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseWorkspaceDto"
  /v1/workspaces/{id}/members/{memberId}/role:
    put:
      tags:
      - member
      summary: Đổi vai trò thành viên
      description: "400 CANNOT_CHANGE_SELF, 403 OWNER_ONLY."
      operationId: changeRole
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMemberDto"
  /v1/price-quotes/{id}:
    get:
      tags:
      - price-quote
      summary: Chi tiết bảng giá
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePriceQuoteDto"
    put:
      tags:
      - price-quote
      summary: Sửa bảng giá — chỉ DRAFT
      description: Không phải DRAFT → 409 PRICE_QUOTE_NOT_DRAFT.
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceQuoteRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePriceQuoteDto"
    delete:
      tags:
      - price-quote
      summary: Xoá bảng giá — chỉ DRAFT
      description: Không phải DRAFT → 409 PRICE_QUOTE_NOT_DRAFT.
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /v1/admin/users/{id}:
    put:
      tags:
      - admin-user
      summary: Cập nhật user
      description: Tự đổi systemRole của mình → 400 CANNOT_CHANGE_SELF.
      operationId: update_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserDto"
  /v1/admin/roles/{code}/permissions:
    put:
      tags:
      - admin-permission
      summary: Thay toàn bộ permission của 1 vai trò
      description: Permission lạ → 400 VALIDATION_ERROR. Evict cache auth.role-permissions.
      operationId: updateRole
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          enum:
          - OWNER
          - ADMIN
          - MEMBER
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePermissionsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseRoleDef"
  /v1/workspaces/{id}/members:
    get:
      tags:
      - member
      summary: Danh sách thành viên
      description: query tìm theo tên/username/email; không truyền status → trả cả
        ACTIVE và REVOKED.
      operationId: list
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: role
        in: query
        required: false
        schema:
          type: string
          enum:
          - OWNER
          - ADMIN
          - MEMBER
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - REVOKED
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListMemberDto"
    post:
      tags:
      - member
      summary: Thêm thành viên
      description: "404 USER_NOT_FOUND, 409 MEMBER_DUPLICATE, 403 OWNER_ONLY (gán\
        \ OWNER khi không phải OWNER)."
      operationId: add
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMemberDto"
  /v1/price-quotes:
    get:
      tags:
      - price-quote
      summary: Danh sách bảng giá (createdAt giảm dần)
      operationId: list_1
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - LOCKED
          - ENDED
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListPriceQuoteDto"
    post:
      tags:
      - price-quote
      summary: Tạo bảng giá DRAFT
      operationId: create
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceQuoteRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePriceQuoteDto"
  /v1/price-quotes/{id}/lock:
    post:
      tags:
      - price-quote
      summary: Khoá bảng giá DRAFT → LOCKED (bảng LOCKED cũ → ENDED)
      description: Không phải DRAFT → 409 PRICE_QUOTE_NOT_DRAFT.
      operationId: lock
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePriceQuoteDto"
  /v1/auth/vsa/login:
    post:
      tags:
      - auth
      summary: Đăng nhập bằng ticket VSA (CAS 2.0)
      description: VSA tắt → 400 VSA_DISABLED; user VSA chưa có tài khoản ACTIVE →
        403 VSA_USER_NOT_PROVISIONED.
      operationId: vsaLogin
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VsaLoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAuthTokens"
      security: []
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Xoay vòng refresh token
      description: Refresh token cũ bị thu hồi. Token sai/hết hạn/đã dùng → 401 UNAUTHORIZED
        (FE đăng xuất).
      operationId: refresh
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAuthTokens"
      security: []
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: Đăng xuất — thu hồi refresh token (idempotent)
      operationId: logout
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
      security: []
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: Đăng nhập bằng username/mật khẩu
      description: Sai thông tin → 401 UNAUTHORIZED; tài khoản bị khoá → 403 USER_LOCKED.
      operationId: login
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAuthTokens"
      security: []
  /v1/auth/change-password:
    post:
      tags:
      - auth
      summary: Tự đổi mật khẩu
      description: Sai mật khẩu cũ → 400 WRONG_PASSWORD (không phải 401). Các phiên
        khác bị thu hồi.
      operationId: changePassword
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /v1/admin/workspaces:
    get:
      tags:
      - admin-workspace
      summary: "Danh sách workspace (tìm theo code/tên), sắp xếp createdAt giảm dầ\
        n"
      operationId: list_2
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - LOCKED
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListWorkspaceDto"
    post:
      tags:
      - admin-workspace
      summary: Tạo workspace + gán OWNER
      description: Trùng code → 409 WORKSPACE_CODE_DUPLICATE; ownerUsername không
        tồn tại → 404 USER_NOT_FOUND.
      operationId: create_1
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseWorkspaceDto"
  /v1/admin/users:
    get:
      tags:
      - admin-user
      summary: "Danh sách user — query tìm username/tên/email/SĐT, sắp xếp createdAt\
        \ giảm dần"
      operationId: list_3
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - LOCKED
      - name: systemRole
        in: query
        required: false
        schema:
          type: string
          enum:
          - SUPER_ADMIN
          - USER
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListUserDto"
    post:
      tags:
      - admin-user
      summary: Tạo user
      description: Trùng username → 409 USERNAME_DUPLICATE.
      operationId: create_2
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserDto"
  /v1/admin/users/{id}/reset-password:
    post:
      tags:
      - admin-user
      summary: Đặt lại mật khẩu (admin nhập tay) — thu hồi mọi refresh token của user
      operationId: resetPassword
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /v1/admin/workspaces/{id}/status:
    patch:
      tags:
      - admin-workspace
      summary: Khoá / mở khoá workspace
      operationId: changeStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceStatusRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseWorkspaceDto"
  /v1/admin/users/{id}/status:
    patch:
      tags:
      - admin-user
      summary: Khoá / mở khoá user
      description: Tự khoá mình → 400 CANNOT_LOCK_SELF. Khoá → thu hồi mọi refresh
        token.
      operationId: changeStatus_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserDto"
  /v1/workspaces/my:
    get:
      tags:
      - workspace
      summary: Workspace ACTIVE của tôi (= MeResponse.workspaces)
      operationId: my
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListMyWorkspace"
  /v1/price-quotes/active:
    get:
      tags:
      - price-quote
      summary: "Bảng giá LOCKED đang áp dụng, hoặc data=null"
      operationId: active
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePriceQuoteDto"
  /v1/me:
    get:
      tags:
      - auth
      summary: "User hiện tại + danh sách workspace (kèm role, permissions)"
      operationId: me
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMeResponse"
  /v1/auth/vsa/config:
    get:
      tags:
      - auth
      summary: Cấu hình đăng nhập VSA cho FE
      operationId: vsaConfig
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVsaConfigDto"
      security: []
  /v1/audit-logs:
    get:
      tags:
      - audit-log
      summary: Tra cứu nhật ký
      description: "from/to: yyyy-MM-dd (giờ Lào, to tính hết ngày) hoặc ISO-8601.\
        \ actor tìm 'chứa'. workspaceId chỉ có tác dụng với SUPER_ADMIN."
      operationId: list_4
