server:
  # dev: 8095 để chạy song song BOC dev (8090). Override bằng SERVER_PORT nếu máy đã có app khác chiếm 8095 (8091 bị một app Java khác chiếm thường trực trên máy dev).
  port: ${SERVER_PORT:8095}

spring:
  # Dev = Oracle XE LOCAL (docker-compose.dev.yml), độc lập với DB dùng chung BOC.
  # CỐ Ý không fallback BOC_DB_* (shell chạy BOC dev hay có sẵn các biến đó) và không có host dùng chung làm default.
  # Trỏ sang DB không phải localhost → DevDatabaseGuard chặn start, trừ khi LAOADS_DEV_ALLOW_REMOTE_DB=true.
  datasource:
    url: ${LAOADS_DB_URL:jdbc:oracle:thin:@//localhost:1521/XE}
    username: ${LAOADS_DB_USERNAME:LAOADS}
    password: ${LAOADS_DB_PASSWORD:laoads}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: laoads-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      # connection-timeout, max-lifetime, connection-test-query, data-source-properties
      # đã set ở application.yml (A+A+ + A+++)
  jpa:
    open-in-view: false
    # ddl-auto: none đã set ở application.yml (A+A+: không validate lúc start)
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.OracleLegacyDialect
        default_schema: ${LAOADS_DB_SCHEMA:LAOADS}
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "LADS_* fresh start"
    table: LADS_FLYWAY_HISTORY
    schemas: ${LAOADS_DB_SCHEMA:LAOADS}
    locations: classpath:db/migration
    clean-disabled: true

laoads:
  dev:
    # true = cho phép profile dev trỏ DB không phải localhost (vd DB dùng chung) — cẩn thận: dev chạy
    # DevDataSeeder (tài khoản demo mật khẩu yếu) và flyway.repair() trên DB đó.
    allow-remote-db: ${LAOADS_DEV_ALLOW_REMOTE_DB:false}
    # DevMockDataSeeder: nạp mock data (user, workspace, thành viên, bảng giá, nhật ký) vào DB local sau seed gốc.
    # false = DB chỉ có 4 tài khoản + BSD/BCD của DevDataSeeder.
    mock-data: ${LAOADS_DEV_MOCK_DATA:true}
  # Read-only pool — truy vấn báo cáo/analytical (copy BOC, đủ A+++ resilience)
  read-only-datasource:
    jdbc-url: ${LAOADS_DB_URL:jdbc:oracle:thin:@//localhost:1521/XE}
    username: ${LAOADS_DB_USERNAME:LAOADS}
    password: ${LAOADS_DB_PASSWORD:laoads}
    driver-class-name: oracle.jdbc.OracleDriver
    pool-name: laoads-readonly-hikari
    maximum-pool-size: 4
    minimum-idle: 1
    initialization-fail-timeout: -1
    keepalive-time: 30000
    # A+++ runtime resilience
    max-lifetime: 600000
    connection-timeout: 5000
    connection-test-query: "SELECT 1 FROM DUAL"
    data-source-properties:
      oracle.net.CONNECT_TIMEOUT: 5000
      oracle.jdbc.ReadTimeout: 30000
    read-only: true
    auto-commit: false
  # Dev: Vite dev server (port auto-increment 5173 → 5175)
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://localhost:5175
  jwt:
    # Default CHỈ cho dev (≥ 256 bit). uat/prod bắt buộc LAOADS_JWT_SECRET (StartupValidator chặn DEV-ONLY-*).
    secret: ${LAOADS_JWT_SECRET:DEV-ONLY-LAOADS-JWT-SECRET-NOT-FOR-PROD-256BIT-MINIMUM-LENGTH-OK}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.unitel.laoads: DEBUG
    org.hibernate.SQL: DEBUG
