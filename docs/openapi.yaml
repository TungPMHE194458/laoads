openapi: 3.1.0
info:
  title: Unitel LaoAds Backend API
  description: "LaoAds — nền tảng chiến dịch/quảng cáo Unitel Lào. Envelope ApiResponse\
    \ (docs/API_CONTRACT_V1.md). Header Accept-Language: vi | en | lo."
  license:
    name: Proprietary
  version: v1
servers:
- url: http://localhost:8095/api
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: admin-dashboard
  description: Tổng quan Super Admin
- name: admin-user
  description: Quản trị tài khoản (SUPER_ADMIN)
- name: campaign-approval
  description: Phê duyệt chiến dịch
- name: settings
  description: Cấu hình gửi tin
- name: member
  description: Thành viên workspace
- name: price-quote
  description: Bảng giá (Quản lý chi phí)
- name: sender-number
  description: Đầu số gửi tin và cấu hình từng đầu số
- name: segment
  description: Tệp khách hàng
- name: auth
  description: Đăng nhập / refresh / VSA / đổi mật khẩu
- name: campaign
  description: Chiến dịch
- name: public
  description: Link tracking & API sự kiện
- name: admin-permission
  description: Ma trận quyền (SUPER_ADMIN)
- name: workspace
  description: Workspace của tôi
- name: campaign-group
  description: Nhóm chiến dịch
- name: workspace-api-key
  description: API key sự kiện
- name: audit-log
  description: Nhật ký hệ thống
- name: dashboard
  description: Tổng quan workspace
- name: admin-workspace
  description: Quản trị workspace (SUPER_ADMIN)
paths:
  /v1/workspaces/{id}:
    get:
      tags:
      - workspace
      summary: Chi tiết workspace — thành viên ACTIVE hoặc SUPER_ADMIN
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseWorkspaceDto"
    put:
      tags:
      - workspace
      summary: Cập nhật thông tin workspace — cần WORKSPACE_UPDATE
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseWorkspaceDto"
  /v1/workspaces/{id}/members/{memberId}/role:
    put:
      tags:
      - member
      summary: Đổi vai trò thành viên
      description: "400 CANNOT_CHANGE_SELF, 403 OWNER_ONLY."
      operationId: changeRole
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMemberDto"
  /v1/settings/sender-numbers/{id}:
    get:
      tags:
      - sender-number
      summary: Chi tiết đầu số
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSenderDto"
    put:
      tags:
      - sender-number
      summary: Sửa đầu số và cấu hình
      description: gateway.password bỏ trống = giữ mật khẩu đã lưu.
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SenderRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSenderDto"
    delete:
      tags:
      - sender-number
      summary: Xoá đầu số
      description: "Còn chiến dịch chưa kết thúc / huỷ (kể cả Nháp, Bị từ chối) dù\
        ng đầu số → 409 SENDER_IN_USE; khi đó tắt đầu số thay vì xoá."
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSenderDto"
  /v1/settings/notification:
    get:
      tags:
      - settings
      summary: "Cấu hình gửi tin (retry, hoàn tài nguyên, khung giờ không gửi, ngô\
        n ngữ mặc định)"
      operationId: notification
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseNotificationSettings"
    put:
      tags:
      - settings
      summary: Cập nhật cấu hình gửi tin
      operationId: updateNotification
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettings"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseNotificationSettings"
  /v1/price-quotes/{id}:
    get:
      tags:
      - price-quote
      summary: Chi tiết bảng giá
      operationId: get_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePriceQuoteDto"
    put:
      tags:
      - price-quote
      summary: Sửa bảng giá — chỉ DRAFT
      description: Không phải DRAFT → 409 PRICE_QUOTE_NOT_DRAFT.
      operationId: update_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceQuoteRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePriceQuoteDto"
    delete:
      tags:
      - price-quote
      summary: Xoá bảng giá — chỉ DRAFT
      description: Không phải DRAFT → 409 PRICE_QUOTE_NOT_DRAFT.
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /v1/campaigns/{id}:
    get:
      tags:
      - campaign
      summary: Chi tiết chiến dịch (cấu hình + lịch sử)
      operationId: get_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDetail"
    put:
      tags:
      - campaign
      summary: Sửa chiến dịch Nháp / Bị từ chối
      description: Trạng thái khác → 409 CAMPAIGN_LOCKED.
      operationId: update_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: submit
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Request"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDetail"
    delete:
      tags:
      - campaign
      summary: Xoá chiến dịch Nháp / Bị từ chối / Đã huỷ
      operationId: delete_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /v1/campaign-groups/{id}:
    put:
      tags:
      - campaign-group
      summary: Sửa tên / mô tả nhóm
      operationId: rename
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseGroupDto"
    delete:
      tags:
      - campaign-group
      summary: Xoá nhóm trống
      description: Còn chiến dịch → 409 GROUP_IN_USE.
      operationId: delete_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseGroupDto"
  /v1/admin/users/{id}:
    put:
      tags:
      - admin-user
      summary: Cập nhật user
      description: Tự đổi systemRole của mình → 400 CANNOT_CHANGE_SELF.
      operationId: update_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserDto"
  /v1/admin/roles/{code}/permissions:
    put:
      tags:
      - admin-permission
      summary: Thay toàn bộ permission của 1 vai trò
      description: Permission lạ → 400 VALIDATION_ERROR. Evict cache auth.role-permissions.
      operationId: updateRole
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          enum:
          - OWNER
          - ADMIN
          - MEMBER
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePermissionsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseRoleDef"
  /v1/workspaces/{id}/members:
    get:
      tags:
      - member
      summary: Danh sách thành viên
      description: query tìm theo tên/username/email; không truyền status → trả cả
        ACTIVE và REVOKED.
      operationId: list
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: role
        in: query
        required: false
        schema:
          type: string
          enum:
          - OWNER
          - ADMIN
          - MEMBER
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - REVOKED
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListMemberDto"
    post:
      tags:
      - member
      summary: Thêm thành viên
      description: "404 USER_NOT_FOUND, 409 MEMBER_DUPLICATE, 403 OWNER_ONLY (gán\
        \ OWNER khi không phải OWNER)."
      operationId: add
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMemberDto"
  /v1/workspaces/{id}/api-key:
    get:
      tags:
      - workspace-api-key
      summary: Trạng thái API key (chỉ 4 ký tự cuối)
      operationId: get_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseKeyDto"
    post:
      tags:
      - workspace-api-key
      summary: Tạo / xoay vòng API key (key cũ hết hiệu lực ngay) — trả key đầy đủ
        đúng 1 lần
      operationId: rotate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseKeyDto"
    delete:
      tags:
      - workspace-api-key
      summary: Thu hồi API key
      operationId: revoke
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /v1/settings/sender-numbers:
    get:
      tags:
      - sender-number
      summary: Danh sách đầu số kèm cấu hình
      description: Kèm số tin đã gửi hôm nay (giờ Lào).
      operationId: list_1
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListSenderDto"
    post:
      tags:
      - sender-number
      summary: Thêm đầu số
      description: Trùng mã → 409 SENDER_CODE_DUPLICATE; dữ liệu sai → 400 VALIDATION_ERROR.
      operationId: create
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SenderRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSenderDto"
  /v1/settings/sender-numbers/{id}/test-connection:
    post:
      tags:
      - sender-number
      summary: Kiểm tra kết nối gateway theo cấu hình đã lưu
      description: "SMPP: bind_transceiver rồi unbind; HTTP: GET URL. Chưa cấu hì\
        nh → 400 VALIDATION_ERROR."
      operationId: testConnection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTestResultDto"
  /v1/segments:
    get:
      tags:
      - segment
      summary: Danh sách tệp khách hàng
      operationId: list_2
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - FILE
          - QUERY
          - EVENT
          - CAMPAIGN_OUTCOME
          - AUDIENCE
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - BUILDING
          - READY
          - FAILED
          - ARCHIVED
      - name: X-Workspace-Id
        in: header
        description: Workspace hiện hành (bắt buộc)
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
          enum:
          - vi
          - en
          - lo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListSegmentDto"
    post:
      tags:
